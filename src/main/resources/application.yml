# ----------------------------------------------------------------------------
# Payment Gateway & Settlement Core Engine — application.yml (shared defaults)
# ----------------------------------------------------------------------------

spring:
  application:
    name: payment-gateway-settlement-core
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 30s
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080
  servlet:
    context-path: /api/v1

management:
  server:
    port: 8081
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}
      environment: ${APP_ENV:local}

logging:
  level:
    root: INFO
    com.paymentgateway.settlement: DEBUG
    org.springframework.web: INFO
    org.springframework.kafka: INFO
    org.flywaydb: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [traceId=%X{traceId} correlationId=%X{correlationId} paymentId=%X{paymentId} merchantId=%X{merchantId}] %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [traceId=%X{traceId} correlationId=%X{correlationId} paymentId=%X{paymentId} merchantId=%X{merchantId}] %logger{36} - %msg%n"

app:
  environment: ${APP_ENV:local}
  correlation-id:
    header-name: X-Correlation-Id
  outbox:
    enabled: true
    polling-interval: 1s
    batch-size: 50
    max-attempts: 10
    retry-base-backoff: 1s
    retry-max-backoff: 30s
    send-timeout: 10s
    lease-duration: 30s
    kafka:
      topic: payment.events
      dead-letter-topic: payment.events.DLQ
      consumer-group: external-erp-payment-events
  erp:
    consumer-group: external-erp-payment-events
